services:
  - type: web
    name: ai-resume-analyser
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_DEFAULT_PROVIDER
        value: groq
